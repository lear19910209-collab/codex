      const extraHeight = (customerLines.length - 1) * 38 + (itemLines.length - 1) * 42 + (noteLines.length ? noteLines.length * 30 + 75 : 0);
      const height = 1130 + extraHeight; if (height > 14000) throw new Error('备注太长，不适合单张图片，请打印 / 导出 PDF');
      canvas.width = width; canvas.height = height;
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, width, height);
      const text = (value, x, y, size = 22, color = '#243c35', weight = 'normal', align = 'left') => { ctx.fillStyle = color; ctx.font = `${weight} ${size}px ${fontFamily}`; ctx.textAlign = align; ctx.fillText(String(value), x, y); };
      const line = y => { ctx.strokeStyle = '#e2e8de'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(width - pad, y); ctx.stroke(); };
      text('MADE JUST FOR YOU', pad, 80, 15, '#86947b'); text('专属报价单', pad, 140, 42, '#194b3e', '600');
      text('报价日期 ' + date(q.createdAt), width - pad, 100, 16, '#85937f', 'normal', 'right'); text('编号 ' + q.id.slice(-8).toUpperCase(), width - pad, 130, 16, '#85937f', 'normal', 'right');
      ctx.fillStyle = '#194b3e'; ctx.fillRect(pad, 174, contentWidth, 3);
      text('为你准备的报价', pad, 221, 18, '#829074'); let y = 267;
      customerLines.forEach(s => { text(s, pad, y, 28, '#243c35', '600'); y += 38; });
      y += 8; const itemHeight = itemLines.length * 42 + 82;
      ctx.fillStyle = '#f1f5e9'; ctx.fillRect(pad, y, contentWidth, itemHeight);
      let itemY = y + 49; itemLines.forEach(s => { text(s, pad + 24, itemY, 30, '#354d3b', '600'); itemY += 42; });
      text(`数量 ${q.quantity}   /   单价 ${yuan(q.unitPrice)}`, pad + 24, itemY + 9, 20, '#7c8e70'); y += itemHeight + 44;
      for (const [label, amount] of [['商品金额', yuan(q.goods)], ['运费', yuan(q.shipping)], ['加急费', yuan(q.rush)], ['其他费用', yuan(q.extraFee)], ['优惠金额', '−' + yuan(q.discount)]]) { text(label, pad, y, 22, '#829074'); text(amount, width - pad, y, 23, '#354d3b', 'normal', 'right'); y += 45; }
      y += 6; ctx.fillStyle = '#194b3e'; ctx.fillRect(pad, y, contentWidth, 106); text('订单总价', pad + 26, y + 64, 23, '#fff'); text(yuan(q.total), width - pad - 26, y + 67, 42, '#fff', '600', 'right'); y += 155;
      text(`定金 · ${decimal(q.depositRate).replace(/\.00$/, '')}%`, pad, y, 19, '#829074'); text('尾款', width / 2 + 26, y, 19, '#829074'); y += 47;
      text(yuan(q.deposit), pad, y, 31, '#354d3b', '600'); text(yuan(q.balance), width / 2 + 26, y, 31, '#354d3b', '600'); y += 37; line(y);
      if (noteLines.length) { y += 49; text('备注', pad, y, 20, '#354d3b', '600'); y += 35; noteLines.forEach(s => { text(s, pad, y, 20, '#829074'); y += 30; }); }
      text('感谢信任 · 期待为你完成这份心意', width / 2, height - 50, 17, '#99a589', 'normal', 'center');
      const blob = await new Promise((resolve, reject) => canvas.toBlob(b => b ? resolve(b) : reject(new Error('图片生成失败')), 'image/png'));

  $('#quote-image').onclick = quoteImage;
  $('#quote-print').onclick = () => {

  async function importFile(file) {
    if (!file || importBusy) return; importBusy = true;
    try {
      if (file.size > 20 * 1024 * 1024) throw new Error('备份文件超过 20 MB，请检查是否选错文件');
      const incoming = C.validateData(JSON.parse((await file.text()).replace(/^\uFEFF/, '')));
      const snapshot = rawSnapshot;
      if (!await confirmAction('恢复这份备份？', `备份包含 ${incoming.orders.length} 笔订单和 ${incoming.products.length} 个价格库项目。\n将替换当前的 ${data.orders.length} 笔订单和 ${data.products.length} 个项目。导入前会保留当前数据的恢复副本。`, '确认恢复')) return;
      if (snapshot !== rawSnapshot || localStorage.getItem(KEY) !== snapshot) throw new Error('确认期间数据发生变化，请重新选择备份');
      if (rawSnapshot) {
        try { localStorage.setItem(RECOVERY_KEY, rawSnapshot); }
        catch (e) { throw new Error('无法保存导入前的恢复副本（可能空间不足）。未替换数据，请先导出备份并释放浏览器空间。'); }
      }
      commit(incoming, { restoring: true }); $('#detail-dialog').close(); $('#quote-dialog').close(); toast('备份已恢复，统计和价格库已同步');

    if (e.target.id === 'order-search') { searchText = e.target.value; $('#order-results').innerHTML = orderResults(); }
    if (e.target.id === 'customer-search') { customerSearch = e.target.value; $('#customer-results').innerHTML = customerResults(); }
    if (e.target.id === 'product-search') { productSearch = e.target.value; $('#product-results').innerHTML = productResults(); }
  });
  document.addEventListener('change', e => { if (e.target.id === 'status-filter') { statusFilter = e.target.value; $('#order-results').innerHTML = orderResults(); } });
  document.addEventListener('click', async e => {
    const close = e.target.closest('[data-close]');
    if (close) { if (close.dataset.close === 'editor-dialog') await closeEditor(); else document.getElementById(close.dataset.close).close(); return; }
    const button = e.target.closest('[data-action]'); if (!button) return;
    const action = button.dataset.action, recordId = button.dataset.id;
    try {
      if (action === 'new-order') openOrder();
      if (action === 'new-product') openProduct();
      if (action === 'edit-product') openProduct(recordId);
      if (action === 'use-product') openOrder(null, recordId);
      if (action === 'repeat-customer') openOrder(null, null, recordId);
      if (action === 'detail') showDetail(recordId);
      if (action === 'edit-order') openOrder(recordId);
      if (action === 'quote') showQuote(recordId);
      if (action === 'save-status') {
        const status = $('#detail-status').value;
        commit({ ...data, orders: data.orders.map(o => o.id === recordId ? { ...o, status, updatedAt: timestamp() } : o) }); showDetail(recordId, false); toast('状态已更新，统计已同步');
      }
      if (action === 'delete-order') {

          if (snapshot !== rawSnapshot) throw new Error('数据已更新，请重新检查后删除');
          commit({ ...data, orders: data.orders.filter(o => o.id !== recordId) }); $('#detail-dialog').close(); toast('订单已删除，统计已同步');
        }
      }
      if (action === 'delete-product') {
        const snapshot = rawSnapshot;
        if (await confirmAction('删除价格库项目？', '已有订单及历史报价会保留。', '删除项目')) {
          if (snapshot !== rawSnapshot) throw new Error('数据已更新，请重新检查后删除');
          commit({ ...data, products: data.products.filter(p => p.id !== recordId) }); toast('价格库项目已删除');
        }
      }
      if (action === 'clear-search') { searchText = ''; statusFilter = ''; render(); }
      if (action === 'backup') backup();
      if (action === 'csv') { download(C.csv(data.orders), `小单全部订单-${C.localDay(new Date())}.csv`, 'text/csv;charset=utf-8'); toast(`已导出 ${data.orders.length} 笔订单的 CSV 表格`); }
      if (action === 'import') $('#import-file').click();
      if (action === 'recovery') { const raw = localStorage.getItem(RECOVERY_KEY); if (raw) download(raw, backupName('小单导入前恢复副本'), 'application/json'); }
    } catch (err) { toast(err.message); }
  });
  $('#editor-dialog').addEventListener('cancel', e => { e.preventDefault(); closeEditor(); });
  window.addEventListener('hashchange', navigate);
  window.addEventListener('beforeunload', e => { if (dirty && $('#editor-dialog').open) { e.preventDefault(); e.returnValue = ''; } });
  window.addEventListener('storage', e => {
    if (e.key === KEY || e.key === null) {
      load(); render(); $('#detail-dialog').close(); $('#quote-dialog').close();
      toast('另一个窗口修改了数据，当前列表已同步。打开的表单请关闭后重新填写。');
    }
  });
  load(); navigate();
})();
</script>

-height:2}\n@media(max-width:650px){main{margin:12px;padding:25px 20px}h1{font-size:25px}h2{font-size:21px}table{font-size:12px}th,td{padding:7px}body{font-size:14px}.toolbar{padding:0 12px}}\n@media print{body{background:#fff;font-size:10.5pt;line-height:1.8}main{padding:0;margin:0;max-width:none;border-radius:0}h1{font-size:25pt}h2{font-size:15pt;margin:22pt 0 12pt}h3{font-size:12pt;margin:17pt 0 9pt}table{font-size:9pt;line-height:1.65;margin:10pt 0}th,td{padding:6pt 7pt}.toolbar{display:none}th,blockquote,.guide-links{-webkit-print-color-adjust:exact;print-color-adjust:exact}}\n\u003c/style\u003e\u003c/head\u003e\u003cbody\u003e\u003cmain\u003e\u003cdiv class=\"guide-links\"\u003e\u003cstrong\u003e当前是电脑单文件交付版\u003c/strong\u003e\u003cbr\u003e\n把这个 HTML 文件下载到电脑的固定文件夹，用 Chrome 或 Edge 打开。不需要解压、注册、联网或访问 GitHub。订单保存在当前浏览器里，请定期下载 JSON 备份。\u003cbr\u003e\niPad 的“文件”预览通常不能完整运行或保存本软件。给 iPad 使用者交付时，需要另提供可以访问的软件网页地址，并在 Safari 中打开。\u003cbr\u003e\n本说明书同时介绍网页和文件两种方式；没有另附网页地址时，请按“电脑通过文件离线使用”操作。\u003c/div\u003e\u003cdiv class=\"manual-label\"\u003eXIAODAN · USER GUIDE\u003c/div\u003e\u003ch1\u003e小单 · 个人接单报价管家\u003c/h1\u003e\n\u003ch2\u003e使用说明书\u003c/h2\u003e\u003cdiv class=\"guide-links\"\u003e从零开始：打开软件 → 保存常用价格 → 新建订单 → 更新收款状态 → 发送报价单 → 下载数据备份\u003c/div\u003e\n\u003cp\u003e适用版本：当前已发布的第一版（含网页、iPad 主屏幕和电脑离线使用方式）\u003c/p\u003e\n\u003cp\u003e文档日期：2026 年 10 月 7 日\u003c/p\u003e\n\u003cp\u003e适用人群：在闲鱼、微信、小红书等平台接私人订单的设计、定制、手工、维修、打印、摄影等小卖家。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e软件使用网址：软件提供方另行提供的网页地址（电脑文件版无需网址）\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e这份说明书可直接随软件交付给买家。文中的客户、金额和订单均为演示示例，不代表真实交易。\u003c/p\u003e\n\u003ch2\u003e目录\u003c/h2\u003e\n\u003col\u003e\n\u003cli\u003e软件能做什么\u003c/li\u003e\n\u003cli\u003e第一次使用：五分钟上手\u003c/li\u003e\n\u003cli\u003eiPad 怎么打开、添加到主屏幕\u003c/li\u003e\n\u003cli\u003e电脑、手机怎么使用\u003c/li\u003e\n\u003cli\u003e认识首页和五项统计\u003c/li\u003e\n\u003cli\u003e建立商品 / 服务价格库\u003c/li\u003e\n\u003cli\u003e新建订单：每个填写项的含义\u003c/li\u003e\n\u003cli\u003e自动计算规则与完整示例\u003c/li\u003e\n\u003cli\u003e订单状态与收款管理\u003c/li\u003e\n\u003cli\u003e查找、修改、删除订单\u003c/li\u003e\n\u003cli\u003e老客户再次下单与历史报价\u003c/li\u003e\n\u003cli\u003e生成、保存、发送报价单\u003c/li\u003e\n\u003cli\u003e导出订单 CSV，用 Excel 查看\u003c/li\u003e\n\u003cli\u003e备份全部数据与恢复\u003c/li\u003e\n\u003cli\u003e换设备、换浏览器、换使用入口\u003c/li\u003e\n\u003cli\u003e日常接单操作清单\u003c/li\u003e\n\u003cli\u003e常见问题与处理方法\u003c/li\u003e\n\u003cli\u003e使用范围与当前版本限制\u003c/li\u003e\n\u003cli\u003e软件交付说明与快捷操作表\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"section-1\"\u003e1. 软件能做什么\u003c/h2\u003e\n\u003cp\u003e小单用来记录客户订单，并自动计算商品金额、订单总价、定金、尾款、成本和利润。你可以维护常用价格、查老客户报价、生成给客户看的报价单，并导出账目和数据备份。\u003c/p\u003e\n\u003cp\u003e软件有五个主要页面：\u003c/p\u003e\n\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e页面名称\u003c/th\u003e\u003cth\u003e主要用途\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e工作台\u003c/td\u003e\u003ctd\u003e查看当天订单、未收款项、已完成订单和利润\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e订单记录\u003c/td\u003e\u003ctd\u003e搜索、筛选、查看、修改和删除订单\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e商品 / 服务价格库\u003c/td\u003e\u003ctd\u003e保存常用项目的名称、默认售价、默认成本和内部备注\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e客户历史\u003c/td\u003e\u003ctd\u003e按客户昵称查看过去订单和当时的价格\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e备份与导出\u003c/td\u003e\u003ctd\u003e下载订单 CSV、导出全部数据、导入备份恢复\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e不需要在软件里注册账号，也不需要登录 GitHub。买家使用的是上面的软件网页，不是 GitHub 的代码仓库页面。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e先了解数据保存方式：\u003c/strong\u003e订单保存在当前设备、当前浏览器的本地存储中，不会上传到卖家的数据库，也不会自动同步到另一台设备。关闭软件后可以继续使用，但请定期下载备份文件。\u003c/p\u003e\n\u003ch2 id=\"section-2\"\u003e2. 第一次使用：五分钟上手\u003c/h2\u003e\n\u003cp\u003e第一次建议按这个顺序操作：\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e用浏览器打开软件网址。iPad 用户先按第 3 节添加到主屏幕。\u003c/li\u003e\n\u003cli\u003e打开“商品 / 服务价格库”，点击“添加商品 / 服务”。\u003c/li\u003e\n\u003cli\u003e新增“头像定制”：默认售价填 \u003ccode\u003e99\u003c/code\u003e，默认单位成本填 \u003ccode\u003e20\u003c/code\u003e，点击“保存项目”。\u003c/li\u003e\n\u003cli\u003e点击“新建订单”，客户昵称填“练习客户”，从价格库选择“头像定制”。\u003c/li\u003e\n\u003cli\u003e数量填 \u003ccode\u003e1\u003c/code\u003e，定金比例填 \u003ccode\u003e30\u003c/code\u003e，其他金额保持 \u003ccode\u003e0\u003c/code\u003e。此时总价为 99.00 元，定金为 29.70 元，尾款为 69.30 元，预计利润为 79.00 元。\u003c/li\u003e\n\u003cli\u003e点击“保存订单”。看到“订单已保存”提示后，进入“订单记录”查看。\u003c/li\u003e\n\u003cli\u003e打开“详情”，点击“生成报价单”，试着保存一张图片。\u003c/li\u003e\n\u003cli\u003e打开“备份与导出”，点击“导出备份文件”，确认能在设备中找到下载文件。\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e练习完成后可以删除练习订单。正式开始接单时，填写真实客户昵称、价格和实际成本。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e注意：\u003c/strong\u003e表单下方显示了计算结果，不代表订单已经保存；请点击“保存订单”或“保存修改”。\u003c/p\u003e\n\u003ch2 id=\"section-3\"\u003e3. iPad 怎么打开、添加到主屏幕\u003c/h2\u003e\n\u003ch3 id=\"section-3\"\u003e3.1 在 Safari 打开软件\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003e打开 iPad 的 Safari 浏览器。\u003c/li\u003e\n\u003cli\u003e在地址栏输入或粘贴软件网址：\u003ccode\u003e软件提供方另行提供的网页地址（电脑文件版无需网址）\u003c/code\u003e。\u003c/li\u003e\n\u003cli\u003e等待“小单”首页正常显示。首次打开需要联网。\u003c/li\u003e\n\u003cli\u003e确认页面有“工作台”“订单记录”“商品 / 服务价格库”等入口。\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e建议使用 Safari 的普通浏览模式。微信、聊天 App 内置网页窗口或文件预览器可能有不同的保存、下载限制。\u003c/p\u003e\n\u003ch3 id=\"section-3\"\u003e3.2 添加到主屏幕\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003e在 Safari 点“分享”按钮，图标通常为方框加向上的箭头。\u003c/li\u003e\n\u003cli\u003e在菜单中找到“添加到主屏幕”。没有立即看到时，可向下滚动菜单。\u003c/li\u003e\n\u003cli\u003e名称保留“小单”，点击“添加”。\u003c/li\u003e\n\u003cli\u003e返回 iPad 主屏幕，找到“小单”图标。\u003c/li\u003e\n\u003cli\u003e从图标打开软件，再开始录入正式订单。\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e以后可以直接点击主屏幕图标进入，不需要每次查找网址，也不需要下载压缩包、解压或使用电脑部署。\u003c/p\u003e\n\u003cp\u003e如果找不到“添加到主屏幕”，请先确认正在 Safari 中打开完整的软件网页，而不是打开一个下载的 HTML 文件或代码页面。不同 iPadOS 版本的菜单位置可能略有不同。\u003c/p\u003e\n\u003ch3 id=\"section-3\"\u003e3.3 离线使用\u003c/h3\u003e\n\u003cp\u003e软件首次联网打开后，会尝试保存运行所需的网页文件。等待页面加载完成，建议先关闭并重新打开一次，再测试断网使用。\u003c/p\u003e\n\u003cp\u003e缓存准备完成且没有被系统清理时，断网仍可记录订单、计算金额、查看已存数据和生成报价图片。首次访问、重新缓存或获取新版本需要网络。网页缓存与订单数据是两回事，缓存不是数据备份。\u003c/p\u003e\n\u003ch3 id=\"section-3\"\u003e3.4 固定一个使用入口\u003c/h3\u003e\n\u003cp\u003e建议正式使用时固定从主屏幕“小单”图标打开。某些 iPadOS 版本中，Safari 标签页与主屏幕应用可能使用独立存储。如果切换入口后看不到旧订单，先回到原入口检查，导出备份后再到新入口恢复，详见第 15 节。\u003c/p\u003e\n\u003ch2 id=\"section-4\"\u003e4. 电脑、手机怎么使用\u003c/h2\u003e\n\u003ch3 id=\"section-4\"\u003e4.1 电脑通过网址使用\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003e使用最新版 Chrome 或 Edge 打开软件网址。\u003c/li\u003e\n\u003cli\u003e将网址收藏到书签，日后使用同一浏览器、同一用户配置打开。\u003c/li\u003e\n\u003cli\u003e不需要安装开发工具，不需要购买 API。\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e通过网址进入软件不需要登录 GitHub。不同设备的订单数据不会因为打开同一个网址就自动共享。\u003c/p\u003e\n\u003ch3 id=\"section-4\"\u003e4.2 电脑通过文件离线使用\u003c/h3\u003e\n\u003cp\u003e如果交付方提供单独的 \u003ccode\u003eindex.html\u003c/code\u003e 文件：\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e把文件保存到电脑上的固定文件夹。\u003c/li\u003e\n\u003cli\u003e双击文件，或右键“打开方式”，选择 Chrome 或 Edge。\u003c/li\u003e\n\u003cli\u003e正常录入订单，无需运行服务器，也无需联网。\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e如果收到的是压缩包，请先解压，再打开其中的 \u003ccode\u003eindex.html\u003c/code\u003e；也可以请交付方直接发送单独的 HTML 文件。\u003c/p\u003e\n\u003cp\u003e本地文件版本与网页版本属于不同的使用入口，数据不会自动互通。移动文件、重命名文件、换浏览器前，请先备份。\u003c/p\u003e\n\u003ch3 id=\"section-4\"\u003e4.3 手机使用\u003c/h3\u003e\n\u003cp\u003e手机可用完整浏览器打开软件网址，界面会适应窄屏。订单表格较宽时，左右滑动表格可查看后面的金额和操作按钮。\u003c/p\u003e\n\u003cp\u003e手机、平板的本地文件预览器不一定支持完整运行和存储，因此移动设备优先使用网址入口。不同浏览器的下载、分享和打印步骤可能不同。\u003c/p\u003e\n\u003ch2 id=\"section-5\"\u003e5. 认识首页和五项统计\u003c/h2\u003e\n\u003cp\u003e首页“工作台”展示五项统计，以及最近六笔订单。\u003c/p\u003e\n\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e统计名称\u003c/th\u003e\u003cth\u003e实际统计范围\u003c/th\u003e\u003cth\u003e怎么理解\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e今日新增订单\u003c/td\u003e\u003ctd\u003e按设备本机日期统计今天创建的订单，包括今天新增后又取消的订单\u003c/td\u003e\u003ctd\u003e今天记了多少笔单，不代表今天完成或收款的数量\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e待收款金额\u003c/td\u003e\u003ctd\u003e未完成、未取消订单的剩余应收合计\u003c/td\u003e\u003ctd\u003e还有多少钱需要向客户收取\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e待收尾款金额\u003c/td\u003e\u003ctd\u003e已付定金、制作中、待收尾款订单的尾款合计\u003c/td\u003e\u003ctd\u003e已收到约定定金后，还需收取多少尾款\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e已完成订单数\u003c/td\u003e\u003ctd\u003e当前状态为“已完成”的订单数量\u003c/td\u003e\u003ctd\u003e已按完成状态记录的订单数量\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e总利润\u003c/td\u003e\u003ctd\u003e当前所有“已完成”订单的利润合计\u003c/td\u003e\u003ctd\u003e完成订单的累计计算利润，不是所有在做订单的预计利润\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e\u003cstrong\u003e“待收尾款金额”已经包含在“待收款金额”里，两项不要相加。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e例：订单总价为 324 元，定金为 97.20 元，尾款为 226.80 元：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e待付款时，待收款金额计入 324 元，待收尾款金额不计入这笔订单。\u003c/li\u003e\n\u003cli\u003e更新为已付定金后，两项分别计入 226.80 元和 226.80 元。\u003c/li\u003e\n\u003cli\u003e更新为已完成后，两项都不再计入这笔订单，总利润开始计入这笔订单的利润。\u003c/li\u003e\n\u003cli\u003e更新为已取消后，这笔订单不计入应收、尾款和总利润。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e修改订单金额、修改状态、删除订单或恢复备份后，首页统计会同步重新计算。\u003c/p\u003e\n\u003ch2 id=\"section-6\"\u003e6. 建立商品 / 服务价格库\u003c/h2\u003e\n\u003ch3 id=\"section-6\"\u003e6.1 添加常用项目\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003e打开“商品 / 服务价格库”。\u003c/li\u003e\n\u003cli\u003e点击“添加商品 / 服务”。\u003c/li\u003e\n\u003cli\u003e填写名称、默认售价、默认单位成本和备注。\u003c/li\u003e\n\u003cli\u003e点击“保存项目”。\u003c/li\u003e\n\u003c/ol\u003e\n\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e填写项\u003c/th\u003e\u003cth\u003e含义\u003c/th\u003e\u003cth\u003e示例\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e名称\u003c/td\u003e\u003ctd\u003e你出售的商品或服务项目\u003c/td\u003e\u003ctd\u003e头像定制\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e默认售价\u003c/td\u003e\u003ctd\u003e一个单位向客户收取的价格\u003c/td\u003e\u003ctd\u003e99 元 / 件\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e默认单位成本\u003c/td\u003e\u003ctd\u003e完成一个单位需要承担的商品或服务成本\u003c/td\u003e\u003ctd\u003e20 元 / 件\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e备注\u003c/td\u003e\u003ctd\u003e价格库内部说明\u003c/td\u003e\u003ctd\u003e基础款，包含两次修改\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e价格库备注是内部说明，不会自动复制进订单，也不会自动显示在客户报价单上。\u003c/p\u003e\n\u003ch3 id=\"section-6\"\u003e6.2 用价格库项目开单\u003c/h3\u003e\n\u003cp\u003e可以在项目卡片上点击“用这个项目开单”，也可以在“新建订单”中使用“从价格库选择”。名称、单价和单位成本会自动填入，其他金额仍由你填写。\u003c/p\u003e\n\u003cp\u003e带入后可以改价。例如默认售价 99 元，给某个客户报价 89 元，只需修改该订单的单价，不会改变价格库，也不会改变其他订单。\u003c/p\u003e\n\u003ch3 id=\"section-6\"\u003e6.3 搜索、编辑和删除项目\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e使用价格库上方的搜索框，按项目名称查找。\u003c/li\u003e\n\u003cli\u003e点击卡片上的“编辑”，修改后点击“保存项目”。\u003c/li\u003e\n\u003cli\u003e点击“删除”，阅读确认提示后确认删除。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e修改或删除价格库项目，已有订单的名称、单价、成本和历史报价仍然保留。价格库不是库存系统，不会自动扣减数量。\u003c/p\u003e\n\u003ch2 id=\"section-7\"\u003e7. 新建订单：每个填写项的含义\u003c/h2\u003e\n\u003cp\u003e在“工作台”“订单记录”或“客户历史”等页面点击“新建订单”，按以下三组信息填写。\u003c/p\u003e\n\u003ch3 id=\"section-7\"\u003e7.1 客户信息\u003c/h3\u003e\n\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e填写项\u003c/th\u003e\u003cth\u003e是否必填\u003c/th\u003e\u003cth\u003e填写方法\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e客户昵称\u003c/td\u003e\u003ctd\u003e是\u003c/td\u003e\u003ctd\u003e使用你能辨认的昵称，例如“小林 · 微信”\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e联系方式\u003c/td\u003e\u003ctd\u003e否\u003c/td\u003e\u003ctd\u003e可填写微信号、手机号或其他联络方式，留空也能保存\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e相同客户尽量使用完全一致的昵称。昵称不同会分成不同的历史客户；不同客户如果昵称相同，也会归到一起。可用平台或识别后缀区分重名客户。\u003c/p\u003e\n\u003cp\u003e联系方式仅用于自己查看和账目导出，不显示在生成的客户报价单上。\u003c/p\u003e\n\u003ch3 id=\"section-7\"\u003e7.2 商品 / 服务\u003c/h3\u003e\n\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e填写项\u003c/th\u003e\u003cth\u003e填写方法\u003c/th\u003e\u003cth\u003e注意事项\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e从价格库选择\u003c/td\u003e\u003ctd\u003e可选一个常用项目，也可保留自定义\u003c/td\u003e\u003ctd\u003e不选择价格库也能开单\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e项目名称\u003c/td\u003e\u003ctd\u003e填写订单内容，例如“头像定制”\u003c/td\u003e\u003ctd\u003e必填，会显示在客户报价单上\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e数量\u003c/td\u003e\u003ctd\u003e填写整数，例如 1、2、3\u003c/td\u003e\u003ctd\u003e按件计，当前不支持 1.5 等小数数量\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e单价\u003c/td\u003e\u003ctd\u003e一个单位的售价，例如 99\u003c/td\u003e\u003ctd\u003e填数字，不要输入“元”或货币符号\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e单位成本\u003c/td\u003e\u003ctd\u003e一个单位的成本，例如 20\u003c/td\u003e\u003ctd\u003e软件会按数量相乘，不要误填整笔商品总成本\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e运费\u003c/td\u003e\u003ctd\u003e整笔订单的运费，例如 12\u003c/td\u003e\u003ctd\u003e当前版同时作为向客户收取的运费和自己的运费成本\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e第一版每笔订单只有一个商品 / 服务项目字段。不同项目需要分别开单，不能在一笔订单中逐行添加多个项目并分别定价。\u003c/p\u003e\n\u003ch3 id=\"section-7\"\u003e7.3 费用与收款\u003c/h3\u003e\n\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e填写项\u003c/th\u003e\u003cth\u003e含义\u003c/th\u003e\u003cth\u003e示例\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e加急费\u003c/td\u003e\u003ctd\u003e向客户收取的加急费用\u003c/td\u003e\u003ctd\u003e20 元\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e其他费用\u003c/td\u003e\u003ctd\u003e向客户收取的其他收费\u003c/td\u003e\u003ctd\u003e包装服务费 5 元\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e优惠金额\u003c/td\u003e\u003ctd\u003e从整笔订单中减掉的优惠\u003c/td\u003e\u003ctd\u003e减 10 元，填写 10，不填写 −10\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e其他成本\u003c/td\u003e\u003ctd\u003e自己承担的额外成本\u003c/td\u003e\u003ctd\u003e外包、材料等未计入单位成本的支出 7 元\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e定金比例\u003c/td\u003e\u003ctd\u003e约定先收取总价的百分之多少\u003c/td\u003e\u003ctd\u003e30% 填 30，不填 0.3\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e订单状态\u003c/td\u003e\u003ctd\u003e当前的收款或制作阶段\u003c/td\u003e\u003ctd\u003e新客户尚未付款时选“待付款”\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e备注\u003c/td\u003e\u003ctd\u003e客户可以看到的订单说明\u003c/td\u003e\u003ctd\u003e交付日期、修改次数、约定范围\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e没有某项费用时填 \u003ccode\u003e0\u003c/code\u003e，不要留空。金额最多两位小数，按人民币计算。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e“其他费用”增加客户应付金额，“其他成本”减少你的利润，二者不是一回事。\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e订单备注会显示在报价单上，避免在这里填写内部成本、利润、私人评价等不希望客户看到的内容。需要记录这类内部信息时，本版本没有单独的私密备注栏。\u003c/p\u003e\n\u003ch3 id=\"section-7\"\u003e7.4 查看结果并保存\u003c/h3\u003e\n\u003cp\u003e填写时，下方会实时显示订单总价、应收定金、应收尾款、预计利润、商品金额和总成本。\u003c/p\u003e\n\u003cp\u003e确认客户、名称、数量、费用、比例和状态都正确后，点击“保存订单”。出现“订单已保存”提示，才表示本地写入完成。\u003c/p\u003e\n\u003cp\u003e关闭表单时，如果填写内容未保存，软件会提示是否放弃修改。点击取消会保留表单；确认放弃则关闭并丢弃未保存内容。\u003c/p\u003e\n\u003ch2 id=\"section-8\"\u003e8. 自动计算规则与完整示例\u003c/h2\u003e\n\u003ch3 id=\"section-8\"\u003e8.1 七个计算公式\u003c/h3\u003e\n\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e项目\u003c/th\u003e\u003cth\u003e计算公式\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e商品金额\u003c/td\u003e\u003ctd\u003e数量 × 单价\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e订单总价\u003c/td\u003e\u003ctd\u003e商品金额 + 运费 + 加急费 + 其他费用 − 优惠金额\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e定金\u003c/td\u003e\u003ctd\u003e订单总价 × 定金比例，四舍五入到分\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e尾款\u003c/td\u003e\u003ctd\u003e订单总价 − 定金\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e商品成本\u003c/td\u003e\u003ctd\u003e数量 × 单位成本\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e总成本\u003c/td\u003e\u003ctd\u003e商品成本 + 运费 + 其他成本\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e利润\u003c/td\u003e\u003ctd\u003e订单总价 − 总成本\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e软件内部以整数“分”计算。尾款由总价减定金得到，因此定金与尾款相加始终等于总价。定金比例可以为 0% 或 100%；分别表示不收定金或先收全款。\u003c/p\u003e\n\u003ch3 id=\"section-8\"\u003e8.2 一笔完整示例\u003c/h3\u003e\n\u003cp\u003e客户“小林 · 微信”订购 3 件头像定制，填写如下：\u003c/p\u003e\n\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e填写项\u003c/th\u003e\u003cth\u003e数值\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e数量\u003c/td\u003e\u003ctd\u003e3\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e单价\u003c/td\u003e\u003ctd\u003e99 元\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e单位成本\u003c/td\u003e\u003ctd\u003e20 元\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e运费\u003c/td\u003e\u003ctd\u003e12 元\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e加急费\u003c/td\u003e\u003ctd\u003e20 元\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e其他费用\u003c/td\u003e\u003ctd\u003e5 元\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e优惠金额\u003c/td\u003e\u003ctd\u003e10 元\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e其他成本\u003c/td\u003e\u003ctd\u003e7 元\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e定金比例\u003c/td\u003e\u003ctd\u003e30%\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e软件自动得出：\u003c/p\u003e\n\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e结果\u003c/th\u003e\u003cth\u003e计算过程\u003c/th\u003e\u003cth\u003e金额\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e商品金额\u003c/td\u003e\u003ctd\u003e3 × 99\u003c/td\u003e\u003ctd\u003e297.00 元\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e订单总价\u003c/td\u003e\u003ctd\u003e297 + 12 + 20 + 5 − 10\u003c/td\u003e\u003ctd\u003e324.00 元\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e定金\u003c/td\u003e\u003ctd\u003e324 × 30%\u003c/td\u003e\u003ctd\u003e97.20 元\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e尾款\u003c/td\u003e\u003ctd\u003e324 − 97.20\u003c/td\u003e\u003ctd\u003e226.80 元\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e商品成本\u003c/td\u003e\u003ctd\u003e3 × 20\u003c/td\u003e\u003ctd\u003e60.00 元\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e总成本\u003c/td\u003e\u003ctd\u003e60 + 12 + 7\u003c/td\u003e\u003ctd\u003e79.00 元\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e利润\u003c/td\u003e\u003ctd\u003e324 − 79\u003c/td\u003e\u003ctd\u003e245.00 元\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e收到 97.20 元定金后，将状态改为“已付定金”。收到 226.80 元尾款且订单交付完成后，将状态改为“已完成”。\u003c/p\u003e\n\u003ch3 id=\"section-8\"\u003e8.3 运费和成本的口径\u003c/h3\u003e\n\u003cp\u003e当前版“运费”只有一个金额，同时加进客户总价并加进自己的成本，适合收取运费与实际支出一致的场景。\u003c/p\u003e\n\u003cp\u003e如果你给客户包邮，可以把“运费”填 \u003ccode\u003e0\u003c/code\u003e，将自己承担的实际寄件支出计入“其他成本”。例如实际寄件费 12 元，可以把其他成本增加 12 元。\u003c/p\u003e\n\u003cp\u003e如果向客户收取的运费与实际支付运费不同，当前版没有两个独立的运费栏，不能单独准确核算这部分运费差额。请根据实际情况核对账目，不把这一版的估算结果直接当作完整财务报表。\u003c/p\u003e\n\u003cp\u003e加急费若还带来额外支出，需要另外填入“其他成本”。不要把同一笔成本同时填入单位成本和其他成本，以免重复扣除。\u003c/p\u003e\n\u003ch3 id=\"section-8\"\u003e8.4 优惠、零金额和亏损\u003c/h3\u003e\n\u003cul\u003e\n\u003cli\u003e优惠为正数，软件负责扣除；优惠不能超过优惠前订单金额。\u003c/li\u003e\n\u003cli\u003e单价和各项费用可以填 0；完全抵扣后总价可以为 0。\u003c/li\u003e\n\u003cli\u003e成本高于总价时，利润会显示负数，代表按当前输入计算的亏损。\u003c/li\u003e\n\u003cli\u003e修改已收定金订单的金额或比例，会重算“应收定金”和“应收尾款”，软件不会保留此前实收款金额。遇到客户已经实际支付旧定金的情况，请先核对实际款项，当前版不能独立记录调整后的实收差额。\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2 id=\"section-9\"\u003e9. 订单状态与收款管理\u003c/h2\u003e\n\u003ch3 id=\"section-9\"\u003e9.1 六种状态的含义\u003c/h3\u003e\n\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e状态\u003c/th\u003e\u003cth\u003e软件采用的收款假设\u003c/th\u003e\u003cth\u003e待收款如何计入\u003c/th\u003e\u003cth\u003e是否计入首页总利润\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e待付款\u003c/td\u003e\u003ctd\u003e尚未收到付款\u003c/td\u003e\u003ctd\u003e整笔订单总价\u003c/td\u003e\u003ctd\u003e否\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e已付定金\u003c/td\u003e\u003ctd\u003e已收到约定的定金\u003c/td\u003e\u003ctd\u003e尾款\u003c/td\u003e\u003ctd\u003e否\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e制作中\u003c/td\u003e\u003ctd\u003e默认已收到约定的定金\u003c/td\u003e\u003ctd\u003e尾款\u003c/td\u003e\u003ctd\u003e否\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e待收尾款\u003c/td\u003e\u003ctd\u003e默认已收到约定的定金\u003c/td\u003e\u003ctd\u003e尾款\u003c/td\u003e\u003ctd\u003e否\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e已完成\u003c/td\u003e\u003ctd\u003e默认已经收全款\u003c/td\u003e\u003ctd\u003e0\u003c/td\u003e\u003ctd\u003e是\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e已取消\u003c/td\u003e\u003ctd\u003e退出当前应收与利润统计\u003c/td\u003e\u003ctd\u003e0\u003c/td\u003e\u003ctd\u003e否\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e“已完成”不仅影响制作进度，也代表软件认为已经收齐款项。已经制作完成但还没收尾款时，使用“待收尾款”，避免把未到账的钱当作已收款。\u003c/p\u003e\n\u003cp\u003e“制作中”默认已收定金。如果你的订单实际未收定金，不要仅为了标记开始制作就选这个状态，否则首页会少计待收款项。第一版将制作与收款合并为一套状态，无法独立标记“未收定金但制作中”。\u003c/p\u003e\n\u003ch3 id=\"section-9\"\u003e9.2 修改订单状态\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003e在“订单记录”找到订单，点击“详情”。\u003c/li\u003e\n\u003cli\u003e在“更新状态”的下拉菜单选择新的状态。\u003c/li\u003e\n\u003cli\u003e点击“保存状态”。仅选择状态但未点击保存，不算更新完成。\u003c/li\u003e\n\u003cli\u003e返回首页查看变化。\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e在“修改订单”表单中也可选择状态，再点击“保存修改”。状态不强制按顺序流转，选错后可以修改回来。\u003c/p\u003e\n\u003ch3 id=\"section-9\"\u003e9.3 推荐的正常流程\u003c/h3\u003e\n\u003cp\u003e待付款 → 已付定金 → 制作中 → 待收尾款 → 已完成。\u003c/p\u003e\n\u003cp\u003e不收定金的订单，可以根据实际收款情况调整流程；由于制作中仍按“已收到约定定金”处理，定金比例为 0% 时，制作中的剩余应收依然是全部总价。\u003c/p\u003e\n\u003cp\u003e取消订单建议保留记录并设为“已取消”，便于将来查询沟通历史。软件不会执行退款，也不会跟踪已取消订单的定金保留、退款或损失。\u003c/p\u003e\n\u003ch2 id=\"section-10\"\u003e10. 查找、修改、删除订单\u003c/h2\u003e\n\u003ch3 id=\"section-10\"\u003e10.1 搜索订单\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003e打开“订单记录”。\u003c/li\u003e\n\u003cli\u003e在搜索框中输入客户昵称、项目名称或订单备注里的关键词。\u003c/li\u003e\n\u003cli\u003e列表会随输入变化，只显示匹配的订单。\u003c/li\u003e\n\u003cli\u003e清空关键词，或使用无匹配结果页面的“清空筛选”，恢复查看。\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e当前订单搜索不按联系方式、金额或日期查询。\u003c/p\u003e\n\u003ch3 id=\"section-10\"\u003e10.2 按状态筛选\u003c/h3\u003e\n\u003cp\u003e在“全部状态”下拉菜单中选择待付款、制作中等状态。可以同时使用关键词和状态筛选。\u003c/p\u003e\n\u003cp\u003e例如搜索“小林”，再选“待收尾款”，就能查看这个昵称下等待收尾款的订单。\u003c/p\u003e\n\u003ch3 id=\"section-10\"\u003e10.3 查看订单详情\u003c/h3\u003e\n\u003cp\u003e点击订单右侧“详情”，查看客户、联系方式、商品数量、单价、各项费用、定金尾款、成本和利润。\u003c/p\u003e\n\u003cp\u003e详情窗口含内部成本与利润，给客户看时请使用“生成报价单”，不要直接发送详情窗口截图。\u003c/p\u003e\n\u003ch3 id=\"section-10\"\u003e10.4 修改订单\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003e打开订单详情，点击“修改订单”。\u003c/li\u003e\n\u003cli\u003e调整客户、项目、数量、金额、状态或备注。\u003c/li\u003e\n\u003cli\u003e核对下方实时计算结果。\u003c/li\u003e\n\u003cli\u003e点击“保存修改”。\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e修改后，订单记录、客户历史和首页统计都会同步更新。订单的创建日期保持不变，更新日期会变化。\u003c/p\u003e\n\u003cp\u003e如果改了客户昵称，订单会按新昵称重新归入客户历史。旧客户分组中没有其他订单时，会从客户历史列表中消失。\u003c/p\u003e\n\u003cp\u003e已发给客户的图片或 PDF 不会自动更新；改价后请重新生成报价单，再通知客户以哪份为准。\u003c/p\u003e\n\u003ch3 id=\"section-10\"\u003e10.5 删除订单\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003e打开订单详情，点击“删除订单”。\u003c/li\u003e\n\u003cli\u003e阅读确认提示，确认需要删除后点击“删除订单”。\u003c/li\u003e\n\u003cli\u003e订单会从列表和客户历史中移除，统计也会重新计算。\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e删除没有回收站或单笔撤销按钮。需要找回时，只能使用包含该订单的旧备份恢复全部数据；旧备份会覆盖当前数据，所以删除前建议先导出备份。\u003c/p\u003e\n\u003ch2 id=\"section-11\"\u003e11. 老客户再次下单与历史报价\u003c/h2\u003e\n\u003ch3 id=\"section-11\"\u003e11.1 查看客户以前的价格\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003e打开“客户历史”。\u003c/li\u003e\n\u003cli\u003e在搜索框中输入客户昵称或昵称的一部分。\u003c/li\u003e\n\u003cli\u003e找到客户分组，查看历次下单日期、商品 / 服务、历史单价、数量、总价、优惠和状态。\u003c/li\u003e\n\u003cli\u003e点击某笔订单的“详情”，查看完整内容；也可点击“报价单”生成该笔订单当前保存的报价。\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e历史列表包含已取消订单。它反映目前保存的订单内容，不是不可更改的历史版本存档；编辑旧订单后，历史展示也会变化。\u003c/p\u003e\n\u003ch3 id=\"section-11\"\u003e11.2 再次开单\u003c/h3\u003e\n\u003cp\u003e在客户分组右侧点击“再次开单”，软件会带入客户昵称和联系方式。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e“再次开单”不会自动复制上一次的项目、价格和费用。\u003c/strong\u003e你需要选择价格库或填写新的订单内容，再参考历史报价决定是否沿用老价格。\u003c/p\u003e\n\u003cp\u003e新建订单时，如果填写的昵称与旧订单完全一致，表单会提示已有历史订单和最近报价，便于核对。\u003c/p\u003e\n\u003ch2 id=\"section-12\"\u003e12. 生成、保存、发送报价单\u003c/h2\u003e\n\u003ch3 id=\"section-12\"\u003e12.1 打开报价单\u003c/h3\u003e\n\u003cp\u003e先保存订单，再使用以下任一入口：\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003e订单列表右侧点击“报价单”。\u003c/li\u003e\n\u003cli\u003e订单详情点击“生成报价单”。\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e报价单是专门给客户看的页面，包含客户昵称、项目名称、数量、单价、商品金额、优惠、运费、加急费、其他费用、总价、定金、尾款、备注、报价日期和编号。\u003c/p\u003e\n\u003cp\u003e不会单独显示单位成本、其他成本、总成本、利润、联系方式、内部价格库备注或订单状态。但你主动写进订单备注的内容会显示，因此发送前仍需检查。\u003c/p\u003e\n\u003cp\u003e报价单显示“报价日期”，当前取自订单创建日期；修改订单后不会自动变成修改当天的日期。编号用于识别订单，不是发票编号。报价单展示约定金额，不是付款凭证。\u003c/p\u003e\n\u003ch3 id=\"section-12\"\u003e12.2 保存图片\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003e在报价单顶部点击“保存图片”。\u003c/li\u003e\n\u003cli\u003e等待生成完成，浏览器会下载 PNG 图片。\u003c/li\u003e\n\u003cli\u003e电脑在下载文件夹中查找以“小单报价”开头的 \u003ccode\u003e.png\u003c/code\u003e 文件。\u003c/li\u003e\n\u003cli\u003eiPad 可在 Safari 的下载入口或“文件”App 中查找下载文件；保存位置取决于 Safari 下载设置。\u003c/li\u003e\n\u003cli\u003e打开图片，核对金额和备注后，通过微信等平台发送给客户。\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eiPad 如需保存到“照片”，可以打开图片后点系统“分享”，在系统提供该选项时选择“存储图像”。保存图片按钮通常是下载文件，不等于自动进入相册。\u003c/p\u003e\n\u003ch3 id=\"section-12\"\u003e12.3 打印或导出 PDF\u003c/h3\u003e\n\u003cp\u003e电脑操作：\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e点击“打印 / 导出 PDF”。\u003c/li\u003e\n\u003cli\u003e在浏览器打印窗口中，目标选择“另存为 PDF”或系统提供的 PDF 保存选项。\u003c/li\u003e\n\u003cli\u003e建议关闭“页眉和页脚”，避免输出网页地址或本地文件路径。\u003c/li\u003e\n\u003cli\u003e查看预览，选择保存位置，点击保存。需要纸质报价时选择打印机。\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eiPad 操作：\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e点击“打印 / 导出 PDF”，打开系统打印界面。\u003c/li\u003e\n\u003cli\u003e需要实体打印时，选择支持的打印机。\u003c/li\u003e\n\u003cli\u003e如果系统允许，可展开打印预览页面，再通过“分享”保存到“文件”或发送 PDF。\u003c/li\u003e\n\u003cli\u003eiPadOS 版本和打印界面可能不同；没有找到 PDF 保存入口时，优先使用“保存图片”发送报价。\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e特别长的备注可能不适合单张图片，软件会提示改用打印 / PDF。\u003c/p\u003e\n\u003ch3 id=\"section-12\"\u003e12.4 一段可复制的客户消息\u003c/h3\u003e\n\u003cblockquote\u003e你好，这是本次订单的报价单。总价 324 元，定金 97.20 元，尾款 226.80 元。项目范围和交付说明见图片备注，请确认后回复我。\u003c/blockquote\u003e\n\u003cp\u003e这段是第 8 节示例消息，实际发送时按你自己的订单金额调整。软件不代收款、不检测到账，也不会自动把消息发给客户。\u003c/p\u003e\n\u003ch2 id=\"section-13\"\u003e13. 导出订单 CSV，用 Excel 查看\u003c/h2\u003e\n\u003ch3 id=\"section-13\"\u003e13.1 导出方法\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003e打开“备份与导出”。\u003c/li\u003e\n\u003cli\u003e找到“订单导出到 Excel”，点击“导出订单 CSV”。\u003c/li\u003e\n\u003cli\u003e在下载位置找到以“小单全部订单”开头的 \u003ccode\u003e.csv\u003c/code\u003e 文件。\u003c/li\u003e\n\u003cli\u003e用 Excel、WPS 或支持 CSV 的表格工具打开。\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e导出包含全部订单，包括已完成和已取消订单，不受订单页面当前搜索或状态筛选影响。\u003c/p\u003e\n\u003cp\u003e主要列包括：订单编号、创建时间、客户昵称、联系方式、项目名称、状态、数量、单价、单位成本、商品金额、运费、加急费、其他费用、其他成本、优惠、定金比例、总价、定金、尾款、总成本、利润和备注。\u003c/p\u003e\n\u003cp\u003eCSV 中每笔订单的利润是计算值，包括未完成和已取消订单；如果要与首页总利润一致，需在表格中筛选“已完成”后求和。CSV 的定金和尾款列是约定金额，不是银行流水或实际已收金额。\u003c/p\u003e\n\u003ch3 id=\"section-13\"\u003e13.2 Excel 中文或分列不正常怎么办\u003c/h3\u003e\n\u003cp\u003e文件已使用适合中文的 UTF-8 编码。如果双击打开后乱码或全部内容挤在一列：\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003e在 Excel 选择“数据 → 从文本 / CSV”，或对应版本的导入菜单。\u003c/li\u003e\n\u003cli\u003e选择导出的文件。\u003c/li\u003e\n\u003cli\u003e编码选择 UTF-8，分隔符选择逗号。\u003c/li\u003e\n\u003cli\u003e查看预览正常后导入。\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e部分联系方式、昵称如果以加号等字符开头，可能出现文本保护前缀，这是防止表格把文本当公式执行。用于阅读账目即可。\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eCSV 含联系方式、成本和利润，请自行保管；给客户发报价请使用报价图片或 PDF。CSV 不能导回软件恢复订单，恢复要用 JSON 备份。\u003c/strong\u003e\u003c/p\u003e\n\u003ch2 id=\"section-14\"\u003e14. 备份全部数据与恢复\u003c/h2\u003e\n\u003ch3 id=\"section-14\"\u003e14.1 为什么需要备份\u003c/h3\u003e\n\u003cp\u003e订单保存在浏览器，不是保存在软件 HTML 文件或 GitHub 仓库里。重新下载软件、重新打开网址、重新登录 GitHub，都不能从网上找回已经丢失的本地订单。\u003c/p\u003e\n\u003cp\u003e清理网站数据、换设备、换浏览器、卸载浏览器、部分系统存储清理等，可能让本地数据消失。建议每次处理完订单后导出一次备份，重要修改和删除前也先备份。\u003c/p\u003e\n\u003ch3 id=\"section-14\"\u003e14.2 导出全部数据\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003e打开“备份与导出”。\u003c/li\u003e\n\u003cli\u003e点击“导出备份文件”。\u003c/li\u003e\n\u003cli\u003e等待下载完成，找到以“小单数据备份”开头、后缀为 \u003ccode\u003e.json\u003c/code\u003e 的文件。\u003c/li\u003e\n\u003cli\u003e把它保存到安全位置，并确认文件实际存在。\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e电脑可存到专用备份文件夹、移动硬盘或自己选择的网盘。iPad 可使用“文件”App，在“下载项”中找到文件，再移动到便于查找的文件夹或 iCloud 云盘。使用 iCloud 等同步的是你手动导出的备份文件，不代表软件会自动同步订单。\u003c/p\u003e\n\u003cp\u003eJSON 备份包含全部订单和价格库，也包含客户联系方式、成本和利润。可以按“日期 + 记录用途”整理备份，保留多个版本，例如“接单备份 / 2026-10-07 收工后”。不需要修改文件内容，也不需要学习 JSON。\u003c/p\u003e\n\u003cp\u003e软件显示“上次导出”时间，只表示进行过导出操作；请另外确认下载完成并放在可找回的位置。\u003c/p\u003e\n\u003ch3 id=\"section-14\"\u003e14.3 导入备份恢复\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003e如果当前设备已经有订单，先导出一份当前数据备份。\u003c/li\u003e\n\u003cli\u003e点击“选择备份文件”。\u003c/li\u003e\n\u003cli\u003e在电脑或 iPad 文件选择器中，选中之前导出的 \u003ccode\u003e.json\u003c/code\u003e 文件。\u003c/li\u003e\n\u003cli\u003e软件会检查文件，并显示将导入的订单、价格库数量。\u003c/li\u003e\n\u003cli\u003e核对数量和文件来源，点击“确认恢复”。\u003c/li\u003e\n\u003cli\u003e看到“备份已恢复”提示后，到订单、价格库和首页检查结果。\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003e\u003cstrong\u003e导入是整体替换，不是追加或合并。\u003c/strong\u003e例如当前有 10 笔订单，旧备份只有 8 笔，恢复后会变成旧备份里的 8 笔，当前多出的两笔不会自动保留。\u003c/p\u003e\n\u003cp\u003e若按“取消”，不替换当前数据。不是本软件备份、文件损坏或数据字段不正确时，软件会拒绝导入，原数据不会被替换。\u003c/p\u003e\n\u003ch3 id=\"section-14\"\u003e14.4 导入前的恢复副本\u003c/h3\u003e\n\u003cp\u003e如果浏览器已有保存的数据，导入前会在本地保留一份原数据恢复副本。在“备份与导出”中可下载“上一次导入前的恢复副本”。\u003c/p\u003e\n\u003cp\u003e选错备份并完成恢复后，可以下载这个副本，再把副本导入恢复。恢复前先导出当前状态，便于保留两份数据。\u003c/p\u003e\n\u003cp\u003e恢复副本只保留最近一次导入前的数据，下一次导入可能覆盖它；它也保存在浏览器中，清理网站数据时可能一起丢失。因此它不能代替你独立下载并保管的备份文件。\u003c/p\u003e\n\u003ch2 id=\"section-15\"\u003e15. 换设备、换浏览器、换使用入口\u003c/h2\u003e\n\u003cp\u003e迁移的基本步骤始终是：旧入口导出备份 → 保存或传输 JSON 文件 → 新入口导入备份。\u003c/p\u003e\n\u003ch3 id=\"section-15\"\u003e15.1 从 iPad 换到电脑\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003e在 iPad 旧入口导出 JSON 备份。\u003c/li\u003e\n\u003cli\u003e通过自己的文件同步、邮件或传输工具，将文件送到电脑。\u003c/li\u003e\n\u003cli\u003e在电脑浏览器打开软件网址。\u003c/li\u003e\n\u003cli\u003e打开“备份与导出”，导入 JSON 文件。\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch3 id=\"section-15\"\u003e15.2 从 Safari 切换到主屏幕图标\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003e在 Safari 里仍能看到旧订单时，先导出备份。\u003c/li\u003e\n\u003cli\u003e添加到主屏幕，从图标打开软件。\u003c/li\u003e\n\u003cli\u003e如果订单没有自动出现，导入刚才的备份。\u003c/li\u003e\n\u003cli\u003e后续固定从图标打开，减少入口混用。\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch3 id=\"section-15\"\u003e15.3 从电脑文件版切换到网页版本\u003c/h3\u003e\n\u003cp\u003e先在原来的 \u003ccode\u003eindex.html\u003c/code\u003e 中导出，再到网页版本导入。不能仅把 HTML 文件传给另一台电脑就搬走订单；HTML 是软件程序，JSON 才是你的数据备份。\u003c/p\u003e\n\u003ch3 id=\"section-15\"\u003e15.4 多台设备同时接单\u003c/h3\u003e\n\u003cp\u003e第一版不会自动合并多设备数据。两台设备分别新增订单后，直接拿一台的备份覆盖另一台，可能丢掉另一台新增的记录。\u003c/p\u003e\n\u003cp\u003e建议指定一台设备作为主要记账设备。需要换设备时，先停止旧设备录入、迁移完整备份，再从新设备继续，避免把它当成共享云账本使用。\u003c/p\u003e\n\u003ch2 id=\"section-16\"\u003e16. 日常接单操作清单\u003c/h2\u003e\n\u003ch3\u003e接到新订单时\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003e查客户历史，参考以前的项目和价格。\u003c/li\u003e\n\u003cli\u003e新建订单，确认数量、单价、成本、优惠和定金比例。\u003c/li\u003e\n\u003cli\u003e保存订单，生成报价单并发送给客户。\u003c/li\u003e\n\u003cli\u003e与客户确认范围、交付要求和付款方式。\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch3\u003e收到定金后\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003e在实际收款平台确认到账。\u003c/li\u003e\n\u003cli\u003e打开订单详情，把状态改成“已付定金”，点击“保存状态”。\u003c/li\u003e\n\u003cli\u003e开始制作后按需要更新为“制作中”。\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch3\u003e准备交付时\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003e查看订单详情中的应收尾款。\u003c/li\u003e\n\u003cli\u003e按实际交付和收款安排，更新为“待收尾款”。\u003c/li\u003e\n\u003cli\u003e如果修改了价格，重新生成报价单，让客户确认新金额。\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch3\u003e收齐款项并完成订单后\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003e更新为“已完成”。\u003c/li\u003e\n\u003cli\u003e查看首页已完成订单数和总利润。\u003c/li\u003e\n\u003cli\u003e核对成本是否按实际输入，避免成本为 0 导致利润虚高。\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch3\u003e每天收工前\u003c/h3\u003e\n\u003col\u003e\n\u003cli\u003e查看“待付款”和“待收尾款”等未完成订单。\u003c/li\u003e\n\u003cli\u003e核对状态与真实到账情况。\u003c/li\u003e\n\u003cli\u003e导出一份全部数据备份，确认下载文件可找回。\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch2 id=\"section-17\"\u003e17. 常见问题与处理方法\u003c/h2\u003e\n\u003ch3\u003eQ1：打开链接显示 404\u003c/h3\u003e\n\u003cp\u003e先核对使用的是软件网址：\u003ccode\u003e软件提供方另行提供的网页地址（电脑文件版无需网址）\u003c/code\u003e。带有 \u003ccode\u003egithub.com\u003c/code\u003e、\u003ccode\u003etree\u003c/code\u003e 或 \u003ccode\u003eblob\u003c/code\u003e 的地址通常是代码页面，不是软件入口。\u003c/p\u003e\n\u003cp\u003e软件网页不需要 GitHub 登录。正确网址仍返回 404 时，可能是网页发布配置或托管状态变化，请把网址和错误页面信息告诉软件提供方；不用为此输入账号密码到软件里。\u003c/p\u003e\n\u003ch3\u003eQ2：软件保存后，刷新还有；换入口却没有订单\u003c/h3\u003e\n\u003cp\u003e检查是否换了设备、浏览器、用户配置、无痕窗口、本地文件位置，或从 Safari 切换到主屏幕图标。先回原入口查找；找到后导出 JSON，再到新入口导入。\u003c/p\u003e\n\u003ch3\u003eQ3：没有点保存就关闭表单，能找回吗\u003c/h3\u003e\n\u003cp\u003e未保存表单没有作为订单写入。确认“放弃修改”后，需要重新填写。请先点击保存，再关闭。\u003c/p\u003e\n\u003ch3\u003eQ4：软件提示本地保存失败\u003c/h3\u003e\n\u003cp\u003e可能是浏览器禁用了存储或存储空间不足。失败时不要认为新订单已经写入，也不要立即清理网站数据。先导出现有数据备份，再排查浏览器模式、设备空间或用其他普通浏览器恢复备份。\u003c/p\u003e\n\u003ch3\u003eQ5：软件提示本地数据损坏\u003c/h3\u003e\n\u003cp\u003e请先到“备份与导出”保留原始数据文件，再选择有效的 JSON 备份恢复。原始数据文件不一定能直接导入，保留它有助于后续排查。没有可用备份时，本版本没有自动云端找回功能。\u003c/p\u003e\n\u003ch3\u003eQ6：定金或尾款“看起来不对”\u003c/h3\u003e\n\u003cp\u003e确认定金比例填写的是 \u003ccode\u003e30\u003c/code\u003e 而不是 \u003ccode\u003e0.3\u003c/code\u003e；确认总价已加费用、减优惠。定金四舍五入到分，尾款是总价减定金。查看的是约定金额，不代表系统核验过实际付款。\u003c/p\u003e\n\u003ch3\u003eQ7：利润为什么比预期大或小\u003c/h3\u003e\n\u003cp\u003e检查单位成本是否乘上了数量、其他成本是否重复计入、运费是否按相同收入与支出处理。加急费和其他费用会增加收入，若同时产生额外支出，要填入其他成本。\u003c/p\u003e\n\u003ch3\u003eQ8：新订单已经有利润，首页总利润却没变化\u003c/h3\u003e\n\u003cp\u003e详情显示的是这笔订单的计算利润；首页只累计状态为“已完成”的订单。未完成订单不会计入首页总利润。\u003c/p\u003e\n\u003ch3\u003eQ9：已经制作完，为什么还要用“待收尾款”\u003c/h3\u003e\n\u003cp\u003e“已完成”默认已收全款。制作完但还没收齐钱时，使用“待收尾款”，首页才会继续显示剩余应收。\u003c/p\u003e\n\u003ch3\u003eQ10：取消订单后，之前收的定金去哪了\u003c/h3\u003e\n\u003cp\u003e已取消订单不再计入应收和首页利润。软件没有实际收款流水，也不处理退款或定金留存，请在真实交易记录中另行核对。\u003c/p\u003e\n\u003ch3\u003eQ11：老客户的订单没有归到一起，或者两位客户混在一起\u003c/h3\u003e\n\u003cp\u003e客户按昵称归组，前后昵称不同会分开，重名会合在一起。为不同客户设置稳定、唯一的昵称，例如“小林 · 微信”“小林 · 闲鱼”，并修改对应旧订单的昵称。\u003c/p\u003e\n\u003ch3\u003eQ12：改了价格库，为什么旧订单没跟着改\u003c/h3\u003e\n\u003cp\u003e旧订单保留当时保存的售价和成本，这是正常行为。要调整旧订单，请打开该订单的“修改订单”。\u003c/p\u003e\n\u003ch3\u003eQ13：报价图片下载后在哪里\u003c/h3\u003e\n\u003cp\u003e电脑查看浏览器下载文件夹；iPad 查看 Safari 下载入口及“文件”App 的下载位置。文件名以“小单报价”开头，后缀是 \u003ccode\u003e.png\u003c/code\u003e。它不一定自动进入照片相册。\u003c/p\u003e\n\u003ch3\u003eQ14：导入后少了订单\u003c/h3\u003e\n\u003cp\u003e恢复会整体替换当前数据，旧备份中的记录可能少于当前记录。查看“上一次导入前的恢复副本”，下载后核对并恢复；不要连续多次导入而没有先保留独立文件。\u003c/p\u003e\n\u003ch3\u003eQ15：能把 CSV 导入恢复吗\u003c/h3\u003e\n\u003cp\u003e不能。CSV 用于表格查看，JSON 备份用于恢复订单和价格库。\u003c/p\u003e\n\u003ch3\u003eQ16：软件提示另一个窗口更新了数据\u003c/h3\u003e\n\u003cp\u003e同一浏览器的另一个标签页可能修改了订单。软件会同步列表，并阻止旧表单覆盖新数据。关闭旧表单，重新打开目标订单后再修改，建议避免多个窗口同时编辑同一笔订单。\u003c/p\u003e\n\u003ch3\u003eQ17：会不会把我的成本发给客户\u003c/h3\u003e\n\u003cp\u003e生成的报价单没有成本、利润和联系方式字段；订单详情、CSV 和 JSON 备份含内部信息。请使用报价单发送，并检查订单备注中是否自己写入了内部内容。\u003c/p\u003e\n\u003ch2 id=\"section-18\"\u003e18. 使用范围与当前版本限制\u003c/h2\u003e\n\u003cp\u003e这是一款个人接单记录与报价工具，适合单人、本机使用。使用时请了解以下范围：\u003c/p\u003e\n\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e项目\u003c/th\u003e\u003cth\u003e当前版本范围\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e币种\u003c/td\u003e\u003ctd\u003e人民币，金额最多两位小数\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e单笔项目\u003c/td\u003e\u003ctd\u003e一笔订单一个商品 / 服务项目字段\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e数量\u003c/td\u003e\u003ctd\u003e1 到 100000 的整数，不支持小数数量\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e定金比例\u003c/td\u003e\u003ctd\u003e0% 到 100%，最多两位小数\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e单项金额\u003c/td\u003e\u003ctd\u003e不超过 1000 万元\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e单笔总价与总成本\u003c/td\u003e\u003ctd\u003e各不超过 1 亿元\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e优惠\u003c/td\u003e\u003ctd\u003e非负金额，不能使总价低于 0\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e备份导入\u003c/td\u003e\u003ctd\u003e本软件第 1 版 JSON 格式，文件最多 20 MB\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e记录上限\u003c/td\u003e\u003ctd\u003e最多 20000 笔订单、5000 个价格库项目；实际可用数量还受浏览器存储空间影响\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e收款\u003c/td\u003e\u003ctd\u003e根据状态推算，不连接微信、支付宝、银行或其他支付平台\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e历史\u003c/td\u003e\u003ctd\u003e保存当前订单内容，没有不可修改的价格版本或操作日志\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e数据同步\u003c/td\u003e\u003ctd\u003e本地保存，无自动跨设备或多人同步\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e数据恢复\u003c/td\u003e\u003ctd\u003e依赖自行保管的 JSON 备份，无云端自动恢复\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e当前不支持部分追加付款流水、退款流水、分次收款、独立制作状态、库存、发票、多币种、多用户、复杂权限、会员或付费授权锁。\u003c/p\u003e\n\u003cp\u003e软件没有自动计算全部经营开支、税费、人工时薪和其他未录入成本。需要计入的支出由你如实填入单位成本或其他成本。计算结果用于帮助报价和记账，不替代完整的会计报表。\u003c/p\u003e\n\u003cp\u003e不需要 AI 接口、不需要购买 API，也没有在线支付或微信登录。\u003c/p\u003e\n\u003ch2 id=\"section-19\"\u003e19. 软件交付说明与快捷操作表\u003c/h2\u003e\n\u003ch3 id=\"section-19\"\u003e19.1 给新使用者的交付方式\u003c/h3\u003e\n\u003cp\u003eiPad、手机或网页使用者：发送软件使用网址和这份说明书。使用者在自己的设备打开，按需添加到主屏幕。首次打开一般是空数据。\u003c/p\u003e\n\u003cp\u003e电脑离线使用者：发送单独的 \u003ccode\u003eindex.html\u003c/code\u003e 和这份说明书。该文件包含软件程序，正常使用无需开发源代码、测试文件或依赖安装。\u003c/p\u003e\n\u003cp\u003e要交接已有订单时，再单独发送包含这些订单的 JSON 备份，由接收方导入。JSON 含内部业务数据，不要默认作为普通软件交付附件。\u003c/p\u003e\n\u003cp\u003e当前网址公开，可以被转发。每个人的数据分别存在自己设备里，软件提供方看不到其他使用者的本地订单。当前没有购买账号、序列号验证或一人一授权限制。\u003c/p\u003e\n\u003ch3 id=\"section-19\"\u003e19.2 可复制的交付消息\u003c/h3\u003e\n\u003cblockquote\u003e你好，这是「小单 · 个人接单报价管家」。\u003c/blockquote\u003e\n\u003cblockquote\u003e使用地址：软件提供方另行提供的网页地址（电脑文件版无需网址）\u003c/blockquote\u003e\n\u003cblockquote\u003eiPad 请用 Safari 打开，点击“分享 → 添加到主屏幕”，以后从“小单”图标进入。无需注册账号。\u003c/blockquote\u003e\n\u003cblockquote\u003e首次可先添加常用价格，再新建订单。软件会自动计算总价、定金、尾款和利润。\u003c/blockquote\u003e\n\u003cblockquote\u003e订单保存在你的设备上，请定期在“备份与导出”中下载 JSON 备份。换设备时，通过备份恢复。\u003c/blockquote\u003e\n\u003cblockquote\u003e附件为详细使用说明书，包含操作步骤、计算示例和常见问题。\u003c/blockquote\u003e\n\u003ch3 id=\"section-19\"\u003e19.3 快捷操作表\u003c/h3\u003e\n\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003e想做的事\u003c/th\u003e\u003cth\u003e操作路径\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e保存常用售价和成本\u003c/td\u003e\u003ctd\u003e商品 / 服务价格库 → 添加商品 / 服务 → 保存项目\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e记一笔新订单\u003c/td\u003e\u003ctd\u003e新建订单 → 填写内容 → 保存订单\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e看还有多少钱没收\u003c/td\u003e\u003ctd\u003e工作台 → 待收款金额；订单记录 → 详情\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e更新付款或制作阶段\u003c/td\u003e\u003ctd\u003e订单记录 → 详情 → 更新状态 → 保存状态\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e修改金额或备注\u003c/td\u003e\u003ctd\u003e订单记录 → 详情 → 修改订单 → 保存修改\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e查客户以前的报价\u003c/td\u003e\u003ctd\u003e客户历史 → 搜索昵称 → 查看历次订单\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e给老客户再次开单\u003c/td\u003e\u003ctd\u003e客户历史 → 找到客户 → 再次开单\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e发报价图片给客户\u003c/td\u003e\u003ctd\u003e订单记录 → 报价单 → 保存图片\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e保存 PDF\u003c/td\u003e\u003ctd\u003e报价单 → 打印 / 导出 PDF → 系统保存选项\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e把订单放进 Excel\u003c/td\u003e\u003ctd\u003e备份与导出 → 导出订单 CSV\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e保存全部数据\u003c/td\u003e\u003ctd\u003e备份与导出 → 导出备份文件\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e恢复或迁移数据\u003c/td\u003e\u003ctd\u003e备份与导出 → 选择备份文件 → 确认恢复\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e删除不需要的订单\u003c/td\u003e\u003ctd\u003e订单记录 → 详情 → 删除订单 → 确认\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003e使用时记住三件事：\u003cstrong\u003e填完要保存；收款后要更新状态；收工前要下载备份。\u003c/strong\u003e\u003c/p\u003e\u003c/main\u003e\u003c/body\u003e\u003c/html\u003e"</script>
<script>
(() => {
  const dialog = document.getElementById('offline-help-dialog');
  const frame = document.getElementById('offline-help-frame');
  let loaded = false;
  document.getElementById('offline-help-open').onclick = () => {
    if (!loaded) { frame.srcdoc = JSON.parse(document.getElementById('offline-manual-data').textContent); loaded = true; }
    dialog.showModal();
  };
  document.getElementById('offline-help-close').onclick = () => dialog.close();
  document.getElementById('offline-help-print').onclick = () => { if (loaded) frame.contentWindow.print(); };
})();
</script>
