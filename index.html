  <script>(function (root) {
  'use strict';
  const STATUSES = ['待付款', '已付定金', '制作中', '待收尾款', '已完成', '已取消'];

    const cents = Number(whole) * 100 + Number(fraction.padEnd(2, '0'));

    return cents;
  }
  function percentInput(value) {
    const p = moneyInput(value);

    return p;
  }
  function calc(o) {
    const goods = o.quantity * o.unitPrice;
    const total = goods + o.shipping + o.rush + o.extraFee - o.discount;
    const deposit = Number((BigInt(total) * BigInt(o.depositRate) + 5000n) / 10000n);

  }

    return orders.reduce((s, o) => {

  }
  function validateMeta(o) {
    if (typeof o.id !== 'string' || !/^[A-Za-z0-9_-]{1,80}$/.test(o.id)) throw new Error('记录编号格式不正确');
    for (const k of ['createdAt', 'updatedAt']) {

  function cleanProduct(p) {

      return '"' + s.replace(/"/g, '""') + '"';
    };

    const rows = orders.map(o => {
      const c = calc(o);
      return [safeText(o.id), safeText(o.createdAt), safeText(o.customer), safeText(o.contact), safeText(o.item), safeText(o.status), o.quantity, ...[o.unitPrice, o.unitCost, c.goods, o.shipping, o.rush, o.extraFee, o.otherCost, o.discount, o.depositRate, c.total, c.deposit, c.balance, c.cost, c.profit].map(amount), safeText(o.notes)].join(',');

</script>

      const text = (value, x, y, size = 22, color = '#243c35', weight = 'normal', align = 'left') => { ctx.fillStyle = color; ctx.font = `${weight} ${size}px ${fontFamily}`; ctx.textAlign = align; ctx.fillText(String(value), x, y); };
      const line = y => { ctx.strokeStyle = '#e2e8de'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(width - pad, y); ctx.stroke(); };
      text('MADE JUST FOR YOU', pad, 80, 15, '#86947b'); text('专属报价单', pad, 140, 42, '#194b3e', '600');
      text('报价日期 ' + date(q.createdAt), width - pad, 100, 16, '#85937f', 'normal', 'right'); text('编号 ' + q.id.slice(-8).toUpperCase(), width - pad, 130, 16, '#85937f', 'normal', 'right');
      ctx.fillStyle = '#194b3e'; ctx.fillRect(pad, 174, contentWidth, 3);
      text('为你准备的报价', pad, 221, 18, '#829074'); let y = 267;
      customerLines.forEach(s => { text(s, pad, y, 28, '#243c35', '600'); y += 38; });
      y += 8; const itemHeight = itemLines.length * 42 + 82;
      ctx.fillStyle = '#f1f5e9'; ctx.fillRect(pad, y, contentWidth, itemHeight);
      let itemY = y + 49; itemLines.forEach(s => { text(s, pad + 24, itemY, 30, '#354d3b', '600'); itemY += 42; });
      text(`数量 ${q.quantity}   /   单价 ${yuan(q.unitPrice)}`, pad + 24, itemY + 9, 20, '#7c8e70'); y += itemHeight + 44;
      for (const [label, amount] of [['商品金额', yuan(q.goods)], ['运费', yuan(q.shipping)], ['加急费', yuan(q.rush)], ['其他费用', yuan(q.extraFee)], ['优惠金额', '−' + yuan(q.discount)]]) { text(label, pad, y, 22, '#829074'); text(amount, width - pad, y, 23, '#354d3b', 'normal', 'right'); y += 45; }
      y += 6; ctx.fillStyle = '#194b3e'; ctx.fillRect(pad, y, contentWidth, 106); text('订单总价', pad + 26, y + 64, 23, '#fff'); text(yuan(q.total), width - pad - 26, y + 67, 42, '#fff', '600', 'right'); y += 155;
      text(`定金 · ${decimal(q.depositRate).replace(/\.00$/, '')}%`, pad, y, 19, '#829074'); text('尾款', width / 2 + 26, y, 19, '#829074'); y += 47;
      text(yuan(q.deposit), pad, y, 31, '#354d3b', '600'); text(yuan(q.balance), width / 2 + 26, y, 31, '#354d3b', '600'); y += 37; line(y);
      if (noteLines.length) { y += 49; text('备注', pad, y, 20, '#354d3b', '600'); y += 35; noteLines.forEach(s => { text(s, pad, y, 20, '#829074'); y += 30; }); }
      text('感谢信任 · 期待为你完成这份心意', width / 2, height - 50, 17, '#99a589', 'normal', 'center');
      const blob = await new Promise((resolve, reject) => canvas.toBlob(b => b ? resolve(b) : reject(new Error('图片生成失败')), 'image/png'));
      download(blob, `小单报价-${q.id.slice(-8)}.png`, 'image/png'); toast('报价图片已保存，不含成本与利润');
    } catch (e) { toast(e.message); } finally { button.disabled = false; button.textContent = '保存图片'; }
  }
  $('#quote-image').onclick = quoteImage;
  $('#quote-print').onclick = () => {
    if (!quoteOrder) return; $('#print-area').innerHTML = quoteHTML(quoteOrder); window.print();
  };
  async function importFile(file) {
    if (!file || importBusy) return; importBusy = true;
    try {
      if (file.size > 20 * 1024 * 1024) throw new Error('备份文件超过 20 MB，请检查是否选错文件');
      const incoming = C.validateData(JSON.parse((await file.text()).replace(/^\uFEFF/, '')));
      const snapshot = rawSnapshot;
      if (!await confirmAction('恢复这份备份？', `备份包含 ${incoming.orders.length} 笔订单和 ${incoming.products.length} 个价格库项目。\n将替换当前的 ${data.orders.length} 笔订单和 ${data.products.length} 个项目。导入前会保留当前数据的恢复副本。`, '确认恢复')) return;
      if (snapshot !== rawSnapshot || localStorage.getItem(KEY) !== snapshot) throw new Error('确认期间数据发生变化，请重新选择备份');
      if (rawSnapshot) {
        try { localStorage.setItem(RECOVERY_KEY, rawSnapshot); }
        catch (e) { throw new Error('无法保存导入前的恢复副本（可能空间不足）。未替换数据，请先导出备份并释放浏览器空间。'); }
      }
      commit(incoming, { restoring: true }); $('#detail-dialog').close(); $('#quote-dialog').close(); toast('备份已恢复，统计和价格库已同步');
    } catch (e) { toast('导入未完成：' + (e instanceof SyntaxError ? '文件不是有效的 JSON 备份' : e.message)); }
    finally { importBusy = false; $('#import-file').value = ''; }
  }
  $('#import-file').onchange = e => importFile(e.target.files[0]);
  document.addEventListener('input', e => {
    if (e.target.id === 'order-search') { searchText = e.target.value; $('#order-results').innerHTML = orderResults(); }
    if (e.target.id === 'customer-search') { customerSearch = e.target.value; $('#customer-results').innerHTML = customerResults(); }
    if (e.target.id === 'product-search') { productSearch = e.target.value; $('#product-results').innerHTML = productResults(); }
  });
  document.addEventListener('change', e => { if (e.target.id === 'status-filter') { statusFilter = e.target.value; $('#order-results').innerHTML = orderResults(); } });
  document.addEventListener('click', async e => {
    const close = e.target.closest('[data-close]');
    if (close) { if (close.dataset.close === 'editor-dialog') await closeEditor(); else document.getElementById(close.dataset.close).close(); return; }
    const button = e.target.closest('[data-action]'); if (!button) return;
    const action = button.dataset.action, recordId = button.dataset.id;
    try {
      if (action === 'new-order') openOrder();
      if (action === 'new-product') openProduct();
      if (action === 'edit-product') openProduct(recordId);
      if (action === 'use-product') openOrder(null, recordId);
      if (action === 'repeat-customer') openOrder(null, null, recordId);
      if (action === 'detail') showDetail(recordId);
      if (action === 'edit-order') openOrder(recordId);
      if (action === 'quote') showQuote(recordId);
      if (action === 'save-status') {
        const status = $('#detail-status').value;
        commit({ ...data, orders: data.orders.map(o => o.id === recordId ? { ...o, status, updatedAt: timestamp() } : o) }); showDetail(recordId, false); toast('状态已更新，统计已同步');
      }
      if (action === 'delete-order') {
        const snapshot = rawSnapshot;
        if (await confirmAction('删除这笔订单？', '删除后会同步更新统计和客户历史。此操作不能撤销，请确认已保留必要备份。', '删除订单')) {
          if (snapshot !== rawSnapshot) throw new Error('数据已更新，请重新检查后删除');
          commit({ ...data, orders: data.orders.filter(o => o.id !== recordId) }); $('#detail-dialog').close(); toast('订单已删除，统计已同步');
        }
      }
      if (action === 'delete-product') {
        const snapshot = rawSnapshot;
        if (await confirmAction('删除价格库项目？', '已有订单及历史报价会保留。', '删除项目')) {
          if (snapshot !== rawSnapshot) throw new Error('数据已更新，请重新检查后删除');
          commit({ ...data, products: data.products.filter(p => p.id !== recordId) }); toast('价格库项目已删除');
        }
      }
      if (action === 'clear-search') { searchText = ''; statusFilter = ''; render(); }
      if (action === 'backup') backup();
      if (action === 'csv') { download(C.csv(data.orders), `小单全部订单-${C.localDay(new Date())}.csv`, 'text/csv;charset=utf-8'); toast(`已导出 ${data.orders.length} 笔订单的 CSV 表格`); }
      if (action === 'import') $('#import-file').click();
      if (action === 'recovery') { const raw = localStorage.getItem(RECOVERY_KEY); if (raw) download(raw, backupName('小单导入前恢复副本'), 'application/json'); }
    } catch (err) { toast(err.message); }
  });
  $('#editor-dialog').addEventListener('cancel', e => { e.preventDefault(); closeEditor(); });
  window.addEventListener('hashchange', navigate);
  window.addEventListener('beforeunload', e => { if (dirty && $('#editor-dialog').open) { e.preventDefault(); e.returnValue = ''; } });
  window.addEventListener('storage', e => {
    if (e.key === KEY || e.key === null) {
      load(); render(); $('#detail-dialog').close(); $('#quote-dialog').close();
      toast('另一个窗口修改了数据，当前列表已同步。打开的表单请关闭后重新填写。');
    }
  });
  load(); navigate();
})();
</script>
  <script>
    // Local-file usage stays self-contained. HTTPS / loopback usage can install offline support.
    if (location.protocol === 'http:' || location.protocol === 'https:') {
      for (const [rel, href] of [['manifest', './manifest.webmanifest'], ['apple-touch-icon', './icons/apple-touch-icon.png']]) {
        const link = document.createElement('link'); link.rel = rel; link.href = href; document.head.append(link);
      }
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
      const isIPadOrIPhone = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (isIPadOrIPhone && !navigator.standalone && !matchMedia('(display-mode: standalone)').matches) document.getElementById('install-hint').hidden = false;
    }
    document.getElementById('dismiss-install-hint').onclick = () => { document.getElementById('install-hint').hidden = true; };
  </script>
